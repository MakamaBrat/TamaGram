<!DOCTYPE html>
<html lang="en-us">
  <head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Taroxa</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        margin: 0; padding: 0; overflow: hidden;
        height: 100%; width: 100%;
        position: fixed;
        top: 0; left: 0;
        overscroll-behavior: none;
      }
      #unity-container.unity-mobile { width: 100vw; height: var(--app-height, 100vh); }
      #unity-canvas.unity-mobile { width: 100vw !important; height: var(--app-height, 100vh) !important; }

      /* Любые нативные input/textarea, которые Unity (TMP_InputField)
         создаёт в DOM для вызова системной клавиатуры, должны быть
         зафиксированы и не участвовать в браузерном auto-scroll-into-view. */
      input, textarea {
        position: fixed !important;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Taroxa</div>
      </div>
    </div>
    <script>
      var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.requestFullscreen) {
          try { tg.requestFullscreen(); } catch (e) {}
        }
      }

      // ------------------------------------------------------------
      // Фикс "экран/канвас дёргается при открытии клавиатуры" +
      // "игра отображается некорректно после expand()":
      //
      // Раньше высота бралась через window.innerHeight/visualViewport —
      // они меняются и от клавиатуры, и от expand(), и отличить одно от
      // другого эвристикой ненадёжно (expand() у Telegram асинхронный,
      // из-за чего высота "замораживалась" раньше времени).
      //
      // Правильный источник — tg.viewportStableHeight: Telegram сам
      // гарантирует, что это значение НЕ меняется от появления клавиатуры,
      // но корректно обновляется при реальном expand()/повороте экрана.
      // Вне Telegram (обычный браузер, тест) используем visualViewport.
      // ------------------------------------------------------------
      function currentStableHeight() {
        if (tg && tg.viewportStableHeight) return tg.viewportStableHeight;
        return (window.visualViewport ? window.visualViewport.height : window.innerHeight);
      }

      function lockAppHeight() {
        document.documentElement.style.setProperty('--app-height', currentStableHeight() + 'px');
      }

      lockAppHeight();
      // Подстраховка: на некоторых устройствах viewportStableHeight
      // проставляется не в первый же тик после ready()/expand().
      setTimeout(lockAppHeight, 300);

      if (tg) {
        // Стреляет и на expand/collapse, и на открытие клавиатуры — но
        // viewportStableHeight внутри уже не включает клавиатуру, так что
        // просто всегда пересчитываем из него, без дополнительных условий.
        tg.onEvent("viewportChanged", lockAppHeight);
      } else if (window.visualViewport) {
        // Вне Telegram (тест в обычном мобильном браузере) стабильного
        // значения нет — просто дополнительно защищаемся от прыжков при
        // клавиатуре: обновляем только при заметном изменении (поворот),
        // а на маленькие уменьшения (клавиатура) не реагируем.
        var initialHeight = currentStableHeight();
        window.visualViewport.addEventListener('resize', function () {
          var h = currentStableHeight();
          if (Math.abs(h - initialHeight) > 120) {
            initialHeight = h;
            lockAppHeight();
          } else {
            window.scrollTo(0, 0);
          }
        });
      }

      window.addEventListener('orientationchange', function () {
        setTimeout(lockAppHeight, 300);
      });

      // ------------------------------------------------------------
      // Фикс скролла от нативного <input>/<textarea>, который создаёт
      // TMP_InputField / InputField на WebGL при получении фокуса
      // (через TouchScreenKeyboard.Open). Мобильный браузер, увидев
      // фокус на инпуте, сам пытается "проскроллить" его в зону
      // видимости — это и вызывает рывок экрана, независимо от того,
      // зафиксирован ли body. Гасим этот скролл принудительно и
      // несколько раз подряд, т.к. браузер может скроллить с задержкой
      // (во время анимации появления клавиатуры).
      // ------------------------------------------------------------
      function pinScroll() {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      }

      document.addEventListener('focusin', function (e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
          pinScroll();
          setTimeout(pinScroll, 50);
          setTimeout(pinScroll, 150);
          setTimeout(pinScroll, 300);
          setTimeout(lockAppHeight, 350);
        }
      }, true);

      document.addEventListener('focusout', function (e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
          setTimeout(pinScroll, 50);
          setTimeout(lockAppHeight, 350);
        }
      }, true);

      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.br",
        frameworkUrl: buildUrl + "/WebGL.framework.js.br",
        codeUrl: buildUrl + "/WebGL.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Taroxa",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      // Всегда растягиваем canvas на весь экран (и на мобильных, и на десктопе),
      // т.к. приложение открывается как Telegram Mini App в полноэкранном режиме.
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, interactive-widget=resizes-content';
      document.getElementsByTagName('head')[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";

      // To lower canvas resolution on mobile devices to gain some
      // performance, uncomment the following line:
      // config.devicePixelRatio = 1;

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
